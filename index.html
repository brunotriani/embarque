<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Embarque Idiomas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Aprenda inglês, espanhol, italiano, francês, alemão e japonês para viagens.">
<meta name="theme-color" content="#13203A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Embarque">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Overpass:wght@400;600;700;800&family=Overpass+Mono:wght@500;700&display=swap">
</head>
<body>
<style>
/* Layout: coluna única de app (máx. 640px), placas de sinalização de aeroporto, quadro de partidas no topo */
:root{
  --bg:#F1F2EE; --surface:#FFFFFF; --soft:#E6E8ED; --ink:#13203A; --muted:#566076; --line:#D6D9E0;
  --sign:#F2B705; --sign-ink:#13203A; --go:#1C7D52; --stop:#B83C27;
  --board:#13203A; --board-ink:#F1F2EE; --board-dim:#93A0B8;
  --f-display:"Overpass",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-body:"Overpass",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"Overpass Mono",ui-monospace,Menlo,Consolas,monospace;
  --f-cjk:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI","Meiryo",sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C1220; --surface:#151E31; --soft:#1D2840; --ink:#ECEFF5; --muted:#9AA5BA; --line:#283450;
  --sign:#F5C330; --sign-ink:#0C1220; --go:#4CC08A; --stop:#F0806A;
  --board:#060A13; --board-ink:#ECEFF5; --board-dim:#7E8BA3; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C1220; --surface:#151E31; --soft:#1D2840; --ink:#ECEFF5; --muted:#9AA5BA; --line:#283450;
  --sign:#F5C330; --sign-ink:#0C1220; --go:#4CC08A; --stop:#F0806A;
  --board:#060A13; --board-ink:#ECEFF5; --board-dim:#7E8BA3; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sign);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;margin:0;text-wrap:balance}
h1{font-size:1.75rem;font-weight:800}
h2{font-size:1.25rem;font-weight:800}
h3{font-size:1.05rem;font-weight:700}
p{margin:0}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 56px;display:flex;flex-direction:column;gap:20px}
.muted{color:var(--muted)}
.small{font-size:.875rem}
.label{font-family:var(--f-mono);font-size:.72rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:12px}
.spacer{flex:1}

/* Barra superior */
.top{display:flex;align-items:center;gap:12px}
.brand{font-family:var(--f-mono);font-weight:700;letter-spacing:.18em;font-size:.9rem;display:flex;align-items:center;gap:8px}
.brand i{display:inline-block;width:22px;height:22px;border-radius:5px;background:var(--sign);position:relative}
.brand i::after{content:"";position:absolute;inset:6px 5px 6px 6px;border-top:3px solid var(--sign-ink);border-right:3px solid var(--sign-ink);transform:rotate(45deg) translate(-2px,2px);width:7px;height:7px}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;height:40px;min-width:40px;padding:0 12px;display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;font-size:.875rem}
.iconbtn svg{width:18px;height:18px;flex:none}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.on{background:var(--go)}

/* Idiomas */
.langs{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.langs::-webkit-scrollbar{display:none}
.lang{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px;cursor:pointer;display:flex;flex-direction:column;align-items:flex-start;min-width:84px}
.lang b{font-family:var(--f-mono);font-size:.8rem;letter-spacing:.08em}
.lang span{font-size:.75rem;color:var(--muted)}
.lang[aria-pressed="true"]{background:var(--sign);border-color:var(--sign);color:var(--sign-ink)}
.lang[aria-pressed="true"] span{color:var(--sign-ink)}

/* Quadro de partidas */
.board{background:var(--board);color:var(--board-ink);border-radius:var(--r);padding:18px;display:grid;grid-template-columns:1fr auto;gap:14px 16px;align-items:end}
.board .label{color:var(--board-dim)}
.flap{font-family:var(--f-mono);font-weight:700;font-size:2.4rem;line-height:1;letter-spacing:.04em;display:flex;gap:4px;align-items:baseline}
.flap .d{background:rgba(255,255,255,.08);color:var(--sign);border-radius:4px;padding:4px 6px;min-width:1.2em;text-align:center;font-variant-numeric:tabular-nums}
.flap small{font-size:.9rem;color:var(--board-ink);margin-left:6px;letter-spacing:.1em}
.board .dest{font-weight:600}
.meter{grid-column:1/-1;display:flex;flex-direction:column;gap:6px}
.bar{height:8px;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--sign);border-radius:99px}
.bar.light{background:var(--soft)}
.bar.light>i{background:var(--go)}
.board .stats{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:.78rem;color:var(--board-dim);font-variant-numeric:tabular-nums}
.board .btn{background:transparent;border-color:rgba(255,255,255,.25);color:var(--board-ink)}

/* Botões */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 16px;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;text-align:center}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sign{background:var(--sign);border-color:var(--sign);color:var(--sign-ink)}
.btn.ink{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn.block{width:100%}
.btn.ghost{background:transparent}
.btn svg{width:18px;height:18px;flex:none}

/* Próxima atividade */
.next{border:2px solid var(--ink);border-radius:var(--r);padding:16px;display:flex;gap:14px;align-items:center;background:var(--surface)}
.next .txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}

/* Placas de cenário */
.gates{display:grid;gap:14px}
.gate{border-radius:var(--r);overflow:hidden;background:var(--surface);border:1px solid var(--line)}
.gate-head{background:var(--sign);color:var(--sign-ink);display:flex;align-items:center;gap:12px;padding:12px 14px}
.gate-head svg{width:30px;height:30px;flex:none}
.gate-head h3{flex:1}
.gate-head .code{font-family:var(--f-mono);font-weight:700;font-size:.8rem;letter-spacing:.1em}
.lv{display:grid;grid-template-columns:repeat(3,1fr)}
.lv button{border:0;border-right:1px solid var(--line);background:transparent;padding:12px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:.85rem}
.lv button:last-child{border-right:0}
.lv button:hover{background:var(--soft)}
.lv .pips{display:flex;gap:4px}
.lv .pips i{width:10px;height:10px;border-radius:2px;border:1.5px solid var(--muted)}
.lv .pips i.done{background:var(--go);border-color:var(--go)}
.lv .rec{font-family:var(--f-mono);font-size:.65rem;letter-spacing:.1em;color:var(--go);font-weight:700}
.soon{display:flex;flex-wrap:wrap;gap:8px}
.soon span{border:1px dashed var(--line);border-radius:6px;padding:4px 10px;font-size:.82rem;color:var(--muted)}

/* Cartões genéricos */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.tip{border-left:4px solid var(--sign);padding:4px 0 4px 12px;font-size:.92rem}

/* Atividades da unidade */
.acts{display:flex;flex-direction:column;gap:10px}
.act{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;cursor:pointer;text-align:left;width:100%}
.act:hover{border-color:var(--ink)}
.act .n{font-family:var(--f-mono);font-weight:700;width:34px;height:34px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;flex:none}
.act.done .n{background:var(--go);border-color:var(--go);color:var(--surface)}
.act .txt{flex:1;min-width:0}
.act .score{font-family:var(--f-mono);font-weight:700;font-variant-numeric:tabular-nums}

/* Lição */
.lhead{display:flex;align-items:center;gap:12px}
.lhead .t{flex:1;min-width:0}
.progress{height:6px;background:var(--soft);border-radius:99px;overflow:hidden}
.progress>i{display:block;height:100%;background:var(--ink)}
.phrase-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px 18px;display:flex;flex-direction:column;gap:14px}
.who{font-family:var(--f-mono);font-size:.72rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;display:inline-flex;align-self:flex-start;padding:3px 8px;border-radius:4px;background:var(--soft)}
.who.v{background:var(--sign);color:var(--sign-ink)}
.phrase{font-family:var(--f-display);font-size:1.6rem;font-weight:600;line-height:1.3;overflow-wrap:anywhere}
.phrase:lang(ja),.opt:lang(ja),.bubble:lang(ja){font-family:var(--f-cjk)}
.romaji{font-family:var(--f-mono);font-size:.85rem;color:var(--muted)}
.pt{color:var(--muted)}
.w-ok{color:var(--go)}
.w-miss{color:var(--stop);text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px}
.mic{width:76px;height:76px;border-radius:50%;border:0;background:var(--sign);color:var(--sign-ink);display:grid;place-items:center;cursor:pointer;flex:none}
.mic svg{width:32px;height:32px}
.mic.on{background:var(--stop);color:#fff;animation:pulse 1.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(184,60,39,.5)}100%{box-shadow:0 0 0 18px rgba(184,60,39,0)}}
@media (prefers-reduced-motion: reduce){.mic.on{animation:none}}
.speakrow{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.result{border-radius:8px;padding:12px;background:var(--soft);display:flex;flex-direction:column;gap:6px}
.pct{font-family:var(--f-mono);font-weight:700;font-size:1.4rem;font-variant-numeric:tabular-nums}
.pct.good{color:var(--go)}
.pct.bad{color:var(--stop)}
.speed{display:flex;align-items:center;gap:4px;align-self:flex-start;background:var(--soft);border-radius:999px;padding:4px}
.speed .label{padding:0 8px 0 10px}
.speed button{border:0;background:transparent;border-radius:999px;padding:6px 14px;min-height:36px;cursor:pointer;font-weight:600;font-size:.875rem;color:var(--muted)}
.speed button[aria-checked="true"]{background:var(--ink);color:var(--bg)}
.lfoot{display:flex;gap:10px}
.lfoot .btn{flex:1}

/* Conversa */
.chat{display:flex;flex-direction:column;gap:8px}
.bubble{max-width:88%;padding:10px 14px;border-radius:14px;line-height:1.4;overflow-wrap:anywhere}
.bubble.a{background:var(--surface);border:1px solid var(--line);align-self:flex-start;border-bottom-left-radius:4px}
.bubble.v{background:var(--ink);color:var(--bg);align-self:flex-end;border-bottom-right-radius:4px}
.bubble small{display:block;opacity:.7;font-size:.8rem}

/* Perguntas de múltipla escolha */
.opts{display:flex;flex-direction:column;gap:8px}
.opt{border:1.5px solid var(--line);background:var(--surface);border-radius:8px;padding:12px 14px;text-align:left;cursor:pointer;font-size:1rem}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt.right{border-color:var(--go);background:color-mix(in srgb,var(--go) 12%,var(--surface))}
.opt.wrong{border-color:var(--stop);background:color-mix(in srgb,var(--stop) 12%,var(--surface))}
.opt:disabled{cursor:default}
.listen-big{display:flex;gap:10px;justify-content:center;padding:10px 0}

/* Formulários */
.field{display:flex;flex-direction:column;gap:6px}
.field input,.field select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 12px;min-height:44px;width:100%}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.seg label{border:1px solid var(--line);border-radius:8px;padding:10px 4px;text-align:center;cursor:pointer;background:var(--surface);display:flex;flex-direction:column;gap:2px;font-size:.85rem}
.seg label b{font-family:var(--f-mono);font-size:1rem}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg input:checked+label{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.seg input:focus-visible+label{outline:3px solid var(--sign);outline-offset:2px}

/* Plano */
.days{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.day{display:grid;grid-template-columns:76px 1fr;gap:12px;padding:10px 14px;border-bottom:1px solid var(--line)}
.day:last-child{border-bottom:0}
.day .dd{font-family:var(--f-mono);font-size:.78rem;font-weight:700;letter-spacing:.06em;color:var(--muted);padding-top:2px}
.day ul{margin:0;padding:0;list-style:none;font-size:.9rem;display:flex;flex-direction:column;gap:2px}

/* Resultado do teste */
.lvbars{display:flex;flex-direction:column;gap:10px}
.lvbar{display:grid;grid-template-columns:110px 1fr 48px;gap:10px;align-items:center;font-size:.9rem}
.lvbar .pctx{font-family:var(--f-mono);text-align:right;font-variant-numeric:tabular-nums}
.stamp{align-self:flex-start;border:3px solid var(--go);color:var(--go);border-radius:8px;padding:8px 14px;font-family:var(--f-mono);font-weight:700;letter-spacing:.12em;text-transform:uppercase;transform:rotate(-3deg)}

/* Avisos */
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:.9rem;max-width:calc(100% - 32px);z-index:20}
.note{background:var(--soft);border-radius:8px;padding:12px;font-size:.9rem}
.err{color:var(--stop);font-size:.9rem}
.confirm{border:2px solid var(--stop);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:10px}
.center{text-align:center}
.authbox{margin-top:8vh}

/* ===== v2 ===== */
.linkbtn{border:0;background:none;padding:4px 0;color:var(--muted);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.session{background:var(--surface);border:2px solid var(--ink);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.steps li{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.steps li:first-child{border-top:0}
.steps .txt{flex:1;min-width:0;display:flex;flex-direction:column}
.steps .ck{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none;font-family:var(--f-mono);font-weight:700;font-size:.85rem;color:var(--muted)}
.steps .ck svg{width:16px;height:16px}
.steps li.cur .ck{border-color:var(--ink);color:var(--ink)}
.steps li.done .ck{background:var(--go);border-color:var(--go);color:var(--surface)}
.steps li.done b{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1px}
.btn.small{min-height:36px;padding:6px 12px;font-size:.875rem}
.gate.pro .gate-head{background:var(--ink);color:var(--bg)}
.feature{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;cursor:pointer}
.feature:hover{border-color:var(--ink)}
.feature .txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.chev{font-size:1.6rem;color:var(--muted);line-height:1}
.tools{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.tool{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;cursor:pointer;min-height:64px}
.tool:hover{border-color:var(--ink)}
.chunk{border:2px dashed var(--sign);border-radius:var(--r);padding:12px 16px;display:flex;flex-direction:column;gap:2px}
.pattern{font-family:var(--f-mono);font-weight:700;font-size:1.25rem}
.pattern:lang(ja){font-family:var(--f-cjk)}
.answer{font-size:1.1rem;line-height:1.55;overflow-wrap:anywhere}
.act .n svg{width:18px;height:18px}
textarea{font:inherit;color:inherit;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:10px 12px;width:100%;resize:vertical;min-height:96px;line-height:1.45}
.qa h3{font-size:1rem}
.seg.three{grid-template-columns:repeat(3,1fr)}
.mix,.method,.sites{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px}
.sites{list-style:none;padding:0}
.sites li{display:flex;flex-direction:column;gap:2px;padding:8px 0;border-top:1px solid var(--line)}
.sites li:first-child{border-top:0}
.sites a{color:var(--ink);font-weight:700;text-underline-offset:3px}
.tbl{overflow-x:auto}
.tbl table{border-collapse:collapse;width:100%;font-size:.9rem;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{text-align:left;padding:8px 10px 8px 0;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl th{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.seg.three label b{font-family:var(--f-body);font-size:.9rem}
.talkf{border:2px solid var(--sign)}
.pick{display:flex;flex-wrap:wrap;gap:8px}
.pick input{position:absolute;opacity:0;pointer-events:none}
.pick label{border:1px solid var(--line);border-radius:999px;padding:8px 14px;cursor:pointer;background:var(--surface);font-size:.9rem}
.pick input:checked+label{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pick input:focus-visible+label{outline:3px solid var(--sign);outline-offset:2px}
.chat.talk{gap:10px}
.brow{display:flex;gap:8px;align-items:flex-start}
.brow span{flex:1;min-width:0}
.mini{border:0;background:var(--soft);color:var(--ink);border-radius:50%;width:28px;height:28px;display:inline-grid;place-items:center;cursor:pointer;flex:none;vertical-align:middle}
.mini svg{width:13px;height:13px}
.bubble details{margin-top:4px;font-size:.85rem;color:var(--muted)}
.bubble summary{cursor:pointer}
.bubble .romaji{display:block;margin-top:2px}
.typing{color:var(--muted)}
.fix{align-self:flex-end;max-width:88%;border-left:4px solid var(--sign);background:var(--surface);border-radius:8px;padding:8px 12px;font-size:.9rem;display:flex;flex-direction:column;gap:6px}
.card .fix,.qa .fix{align-self:stretch;max-width:none;background:var(--soft)}
.ok{align-self:flex-end;color:var(--go)}
.better{font-size:1rem}
.composer{position:sticky;bottom:0;background:var(--bg);padding-block:10px calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;align-items:flex-end;border-top:1px solid var(--line)}
.composer textarea{min-height:48px;flex:1;min-width:0;background:var(--surface)}
.mic.sm{width:52px;height:52px}
.mic.sm svg{width:24px;height:24px}
.mic:disabled{opacity:.45}
.fixrow{display:flex;flex-direction:column;gap:2px;padding:8px 0;border-top:1px solid var(--line)}
.fixrow:first-of-type{border-top:0}
</style>
<div id="app"></div>
<script>
/* Conteúdo das lições. Cada linha: [quem, frase, tradução, (romaji só no japonês)]
   quem: "a" = a outra pessoa (oficial, garçom); "v" = você */
const C = {
en: {
  imm: { tip: "Responda só o que foi perguntado, com frases curtas. Tenha o endereço do hotel e a passagem de volta à mão.", l: [
    [["a","Good morning. Passport, please.","Bom dia. Passaporte, por favor."],
     ["v","Good morning. Here you go.","Bom dia. Aqui está."],
     ["a","What is the purpose of your visit?","Qual é o motivo da sua visita?"],
     ["v","Tourism. I'm on vacation.","Turismo. Estou de férias."],
     ["a","How long will you stay?","Quanto tempo vai ficar?"],
     ["v","Ten days.","Dez dias."],
     ["a","Where are you staying?","Onde vai se hospedar?"],
     ["v","At a hotel in Miami.","Em um hotel em Miami."]],
    [["a","Hi, can I see your passport and customs form?","Olá, posso ver seu passaporte e o formulário da alfândega?"],
     ["v","Sure, here they are.","Claro, aqui estão."],
     ["a","Is this your first time in the United States?","É sua primeira vez nos Estados Unidos?"],
     ["v","No, I came here two years ago on vacation.","Não, vim há dois anos, de férias."],
     ["a","Do you have a return ticket?","Você tem passagem de volta?"],
     ["v","Yes, I fly back to São Paulo on the twentieth.","Sim, volto para São Paulo no dia vinte."],
     ["a","Are you bringing any food or plants?","Está trazendo algum alimento ou planta?"],
     ["v","Just some chocolates and a few snacks.","Só alguns chocolates e uns lanchinhos."]],
    [["a","What do you do for a living back in Brazil?","Com o que você trabalha no Brasil?"],
     ["v","I work in finance, and I'm taking a couple of weeks off.","Trabalho com finanças e estou tirando duas semanas de folga."],
     ["a","Are you traveling alone or meeting someone here?","Está viajando sozinho ou vai encontrar alguém aqui?"],
     ["v","I'm meeting some friends in Orlando, then driving down to Miami.","Vou encontrar uns amigos em Orlando e depois descer de carro até Miami."],
     ["a","How much cash are you carrying?","Quanto em dinheiro você está trazendo?"],
     ["v","About eight hundred dollars, plus my credit cards.","Cerca de oitocentos dólares, além dos meus cartões de crédito."],
     ["a","Alright, you're all set. Enjoy your stay.","Certo, está tudo liberado. Aproveite a estadia."],
     ["v","Thank you, have a great day.","Obrigado, tenha um ótimo dia."]]

  rest: { tip: "Nos EUA a gorjeta não vem na conta: deixe de 18% a 20%. O refil de refrigerante costuma ser grátis.", l: [
    [["a","Hi! How many people?","Oi! Quantas pessoas?"],
     ["v","Table for two, please.","Mesa para dois, por favor."],
     ["a","Here's your menu. Something to drink?","Aqui está o cardápio. Algo para beber?"],
     ["v","A water, please.","Uma água, por favor."],
     ["a","Are you ready to order?","Prontos para pedir?"],
     ["v","I'd like the chicken salad.","Eu gostaria da salada de frango."],
     ["a","Anything else?","Mais alguma coisa?"],
     ["v","No, thank you. Check, please.","Não, obrigado. A conta, por favor."]],
    [["a","Do you have a reservation?","Vocês têm reserva?"],
     ["v","Yes, it's under Silva, for seven thirty.","Sim, está no nome de Silva, para as sete e meia."],
     ["a","How would you like your steak cooked?","Qual o ponto da carne?"],
     ["v","Medium well, please.","Ao ponto para bem passada, por favor."],
     ["a","Would you like fries or a side salad with that?","Vai querer batata frita ou salada de acompanhamento?"],
     ["v","Fries, please. And could I get a refill on my soda?","Batata, por favor. E pode completar meu refrigerante?"],
     ["a","How is everything tasting?","Está tudo bom?"],
     ["v","Everything's great, thanks. Could we get the check?","Tudo ótimo, obrigado. Pode trazer a conta?"]],
    [["a","Hi folks, have you dined with us before?","Olá, vocês já comeram aqui antes?"],
     ["v","No, it's our first time. What would you recommend?","Não, é a primeira vez. O que você recomenda?"],
     ["a","Our short ribs are really popular, and the fish tacos are great too.","Nossa costela é muito pedida, e os tacos de peixe também são ótimos."],
     ["v","I have a peanut allergy. Is the sauce safe for me?","Tenho alergia a amendoim. O molho é seguro para mim?"],
     ["a","Let me double-check with the kitchen to be sure.","Vou confirmar com a cozinha para ter certeza."],
     ["v","Thanks. And could we split the check, please?","Obrigado. E podemos dividir a conta, por favor?"],
     ["a","No problem. Would you like a box for the leftovers?","Sem problema. Querem uma embalagem para o que sobrou?"],
     ["v","Yes, please. Is the tip included?","Sim, por favor. A gorjeta está incluída?"]]
  ]}
},
es: {
  imm: { tip: "Na Espanha (espaço Schengen) podem pedir seguro viagem, reserva de hotel e comprovação de dinheiro. Leve tudo no celular ou impresso.", l: [
    [["a","Buenos días. Su pasaporte, por favor.","Bom dia. Seu passaporte, por favor."],
     ["v","Buenos días. Aquí tiene.","Bom dia. Aqui está."],
     ["a","¿Cuál es el motivo de su viaje?","Qual é o motivo da sua viagem?"],
     ["v","Turismo. Estoy de vacaciones.","Turismo. Estou de férias."],
     ["a","¿Cuánto tiempo se va a quedar?","Quanto tempo vai ficar?"],
     ["v","Diez días.","Dez dias."],
     ["a","¿Dónde se va a alojar?","Onde vai se hospedar?"],
     ["v","En un hotel en Madrid.","Em um hotel em Madri."]],
    [["a","¿Tiene el billete de vuelta?","Tem a passagem de volta?"],
     ["v","Sí, vuelvo a Brasil el día veinte.","Sim, volto ao Brasil no dia vinte."],
     ["a","¿Es la primera vez que viene a España?","É a primeira vez que vem à Espanha?"],
     ["v","No, estuve aquí hace dos años.","Não, estive aqui há dois anos."],
     ["a","¿Trae algo que declarar?","Traz algo a declarar?"],
     ["v","No, solo ropa y algunos regalos.","Não, só roupas e alguns presentes."],
     ["a","¿Viaja solo o acompañado?","Viaja sozinho ou acompanhado?"],
     ["v","Viajo con un amigo.","Viajo com um amigo."]],
    [["a","¿A qué se dedica en Brasil?","Com o que você trabalha no Brasil?"],
     ["v","Trabajo en finanzas y me he tomado dos semanas libres.","Trabalho com finanças e tirei duas semanas de folga."],
     ["a","¿Tiene seguro de viaje y una reserva de hotel?","Tem seguro viagem e reserva de hotel?"],
     ["v","Sí, aquí tiene la reserva y la póliza del seguro.","Sim, aqui estão a reserva e a apólice do seguro."],
     ["a","¿Cuánto dinero lleva para la estancia?","Quanto dinheiro leva para a estadia?"],
     ["v","Unos mil euros en efectivo, además de las tarjetas.","Uns mil euros em espécie, além dos cartões."],
     ["a","Muy bien. Que disfrute de su estancia.","Muito bem. Aproveite a estadia."],
     ["v","Muchas gracias, que tenga un buen día.","Muito obrigado, tenha um bom dia."]]
  ]},
  rest: { tip: "Na Espanha o almoço é tarde (14h a 16h) e o jantar depois das 21h. Gorjeta é opcional: arredondar a conta já está bom.", l: [
    [["a","¡Hola! ¿Cuántos son?","Olá! Quantas pessoas?"],
     ["v","Una mesa para dos, por favor.","Uma mesa para dois, por favor."],
     ["a","Aquí tienen la carta. ¿Qué van a beber?","Aqui está o cardápio. O que vão beber?"],
     ["v","Un agua sin gas, por favor.","Uma água sem gás, por favor."],
     ["a","¿Ya saben qué van a pedir?","Já sabem o que vão pedir?"],
     ["v","Quiero la paella, por favor.","Quero a paella, por favor."],
     ["a","¿Algo más?","Mais alguma coisa?"],
     ["v","No, gracias. La cuenta, por favor.","Não, obrigado. A conta, por favor."]],
    [["a","¿Tienen reserva?","Vocês têm reserva?"],
     ["v","Sí, a nombre de Silva, para las ocho y media.","Sim, no nome de Silva, para as oito e meia."],
     ["a","¿Cómo quiere la carne?","Como quer a carne?"],
     ["v","Al punto, por favor.","Ao ponto, por favor."],
     ["a","¿Le traigo algo de beber mientras tanto?","Trago algo para beber enquanto isso?"],
     ["v","Sí, una copa de vino tinto de la casa.","Sim, uma taça de vinho tinto da casa."],
     ["a","¿Qué tal está todo?","Está tudo bem?"],
     ["v","Todo riquísimo, gracias. ¿Nos trae la cuenta?","Tudo delicioso, obrigado. Pode nos trazer a conta?"]],
    [["a","¿Es la primera vez que vienen? ¿Les explico la carta?","É a primeira vez que vêm? Explico o cardápio?"],
     ["v","Sí, por favor. ¿Qué nos recomienda de la casa?","Sim, por favor. O que recomenda da casa?"],
     ["a","El pulpo a la gallega y el cochinillo son nuestras especialidades.","O polvo à galega e o leitão são nossas especialidades."],
     ["v","Soy alérgico a los frutos secos. ¿Llevan algo de eso?","Sou alérgico a castanhas. Os pratos levam algo disso?"],
     ["a","Lo consulto con cocina para asegurarme.","Vou consultar a cozinha para ter certeza."],
     ["v","Gracias. ¿Podemos pagar por separado?","Obrigado. Podemos pagar separado?"],
     ["a","Claro. ¿Les apetece algún postre o un café?","Claro. Querem uma sobremesa ou um café?"],
     ["v","Dos cafés solos, por favor. ¿El servicio está incluido?","Dois cafés pretos, por favor. O serviço está incluído?"]]
  ]}
},
it: {
  imm: { tip: "Na Itália (espaço Schengen) podem pedir seguro viagem, reserva de hotel e comprovação de dinheiro. Leve tudo no celular ou impresso.", l: [
    [["a","Buongiorno. Passaporto, per favore.","Bom dia. Passaporte, por favor."],
     ["v","Buongiorno. Ecco a lei.","Bom dia. Aqui está."],
     ["a","Qual è il motivo del viaggio?","Qual é o motivo da viagem?"],
     ["v","Turismo. Sono in vacanza.","Turismo. Estou de férias."],
     ["a","Quanto tempo si ferma?","Quanto tempo vai ficar?"],
     ["v","Dieci giorni.","Dez dias."],
     ["a","Dove alloggia?","Onde vai se hospedar?"],
     ["v","In un albergo a Roma.","Em um hotel em Roma."]],
    [["a","Ha il biglietto di ritorno?","Tem a passagem de volta?"],
     ["v","Sì, torno in Brasile il venti.","Sim, volto ao Brasil no dia vinte."],
     ["a","È la prima volta che viene in Italia?","É a primeira vez que vem à Itália?"],
     ["v","No, sono già stato qui due anni fa.","Não, já estive aqui há dois anos."],
     ["a","Ha qualcosa da dichiarare?","Tem algo a declarar?"],
     ["v","No, solo vestiti e qualche regalo.","Não, só roupas e alguns presentes."],
     ["a","Viaggia da solo?","Viaja sozinho?"],
     ["v","No, viaggio con un amico.","Não, viajo com um amigo."]],
    [["a","Che lavoro fa in Brasile?","Com o que trabalha no Brasil?"],
     ["v","Lavoro nel settore finanziario e mi sono preso due settimane di ferie.","Trabalho no setor financeiro e tirei duas semanas de férias."],
     ["a","Ha un'assicurazione di viaggio e la prenotazione dell'albergo?","Tem seguro viagem e a reserva do hotel?"],
     ["v","Sì, ecco la prenotazione e la polizza dell'assicurazione.","Sim, aqui estão a reserva e a apólice do seguro."],
     ["a","Quanti soldi ha con sé per il soggiorno?","Quanto dinheiro tem consigo para a estadia?"],
     ["v","Circa mille euro in contanti, più le carte di credito.","Cerca de mil euros em espécie, mais os cartões de crédito."],
     ["a","Va bene. Buona permanenza.","Tudo bem. Boa estadia."],
     ["v","Grazie mille, buona giornata.","Muito obrigado, tenha um bom dia."]]
  ]},
  rest: { tip: "Na Itália o 'coperto' (couvert) costuma vir na conta. Cappuccino depois do almoço é incomum: peça 'un caffè', que é um expresso.", l: [
    [["a","Buonasera! Quanti siete?","Boa noite! Quantas pessoas?"],
     ["v","Un tavolo per due, per favore.","Uma mesa para dois, por favor."],
     ["a","Ecco il menù. Cosa vi porto da bere?","Aqui está o cardápio. O que trago para beber?"],
     ["v","Un'acqua naturale, per favore.","Uma água sem gás, por favor."],
     ["a","Avete deciso?","Já decidiram?"],
     ["v","Vorrei gli spaghetti alla carbonara.","Eu gostaria do espaguete à carbonara."],
     ["a","Altro?","Mais alguma coisa?"],
     ["v","No, grazie. Il conto, per favore.","Não, obrigado. A conta, por favor."]],
    [["a","Avete una prenotazione?","Vocês têm reserva?"],
     ["v","Sì, a nome Silva, per le otto.","Sim, no nome de Silva, para as oito."],
     ["a","Cosa prendete come primo?","O que vão querer de primeiro prato?"],
     ["v","Le lasagne, e come secondo il pollo arrosto.","A lasanha, e de segundo prato o frango assado."],
     ["a","Vino rosso o bianco?","Vinho tinto ou branco?"],
     ["v","Un quarto di vino rosso della casa, per favore.","Um quarto de litro de vinho tinto da casa, por favor."],
     ["a","Va tutto bene?","Está tudo bem?"],
     ["v","Tutto buonissimo, grazie. Ci porta il conto?","Tudo ótimo, obrigado. Pode nos trazer a conta?"]],
    [["a","Volete sentire i piatti del giorno?","Querem ouvir os pratos do dia?"],
     ["v","Sì, volentieri. Cosa ci consiglia?","Sim, com prazer. O que nos recomenda?"],
     ["a","Oggi abbiamo un risotto ai funghi porcini e l'ossobuco.","Hoje temos risoto de funghi porcini e ossobuco."],
     ["v","Sono allergico alla frutta secca. Il risotto la contiene?","Sou alérgico a castanhas. O risoto contém?"],
     ["a","Chiedo subito in cucina per sicurezza.","Pergunto agora na cozinha, por segurança."],
     ["v","Grazie. Possiamo pagare separatamente?","Obrigado. Podemos pagar separado?"],
     ["a","Certo. Gradite un dolce o un caffè?","Claro. Gostariam de uma sobremesa ou um café?"],
     ["v","Due caffè, grazie. Il coperto è compreso?","Dois cafés, obrigado. O couvert está incluído?"]]
  ]}
},
fr: {
  imm: { tip: "Comece sempre com 'Bonjour': na França é falta de educação ir direto ao assunto. Como é Schengen, leve seguro viagem e reserva do hotel.", l: [
    [["a","Bonjour. Votre passeport, s'il vous plaît.","Bom dia. Seu passaporte, por favor."],
     ["v","Bonjour. Le voici.","Bom dia. Aqui está."],
     ["a","Quel est le motif de votre voyage ?","Qual é o motivo da sua viagem?"],
     ["v","Le tourisme. Je suis en vacances.","Turismo. Estou de férias."],
     ["a","Combien de temps restez-vous ?","Quanto tempo vai ficar?"],
     ["v","Dix jours.","Dez dias."],
     ["a","Où logez-vous ?","Onde vai se hospedar?"],
     ["v","Dans un hôtel à Paris.","Em um hotel em Paris."]],
    [["a","Avez-vous votre billet de retour ?","Tem a passagem de volta?"],
     ["v","Oui, je rentre au Brésil le vingt.","Sim, volto ao Brasil no dia vinte."],
     ["a","C'est votre première visite en France ?","É sua primeira visita à França?"],
     ["v","Non, je suis déjà venu il y a deux ans.","Não, já vim há dois anos."],
     ["a","Avez-vous quelque chose à déclarer ?","Tem algo a declarar?"],
     ["v","Non, seulement des vêtements et quelques cadeaux.","Não, só roupas e alguns presentes."],
     ["a","Vous voyagez seul ?","Viaja sozinho?"],
     ["v","Non, je voyage avec un ami.","Não, viajo com um amigo."]],
    [["a","Quelle est votre profession au Brésil ?","Qual é sua profissão no Brasil?"],
     ["v","Je travaille dans la finance et j'ai pris deux semaines de congé.","Trabalho com finanças e tirei duas semanas de folga."],
     ["a","Avez-vous une assurance voyage et une réservation d'hôtel ?","Tem seguro viagem e reserva de hotel?"],
     ["v","Oui, voici la réservation et l'attestation d'assurance.","Sim, aqui estão a reserva e o comprovante do seguro."],
     ["a","Combien d'argent avez-vous pour votre séjour ?","Quanto dinheiro tem para a estadia?"],
     ["v","Environ mille euros en espèces, plus mes cartes bancaires.","Cerca de mil euros em espécie, mais meus cartões."],
     ["a","Très bien. Bon séjour en France.","Muito bem. Boa estadia na França."],
     ["v","Merci beaucoup, bonne journée.","Muito obrigado, tenha um bom dia."]]
  ]},
  rest: { tip: "Na França o serviço já vem incluído ('service compris'). A água da torneira em jarra ('une carafe d'eau') é grátis.", l: [
    [["a","Bonsoir ! Vous êtes combien ?","Boa noite! Quantas pessoas?"],
     ["v","Une table pour deux, s'il vous plaît.","Uma mesa para dois, por favor."],
     ["a","Voici la carte. Qu'est-ce que vous buvez ?","Aqui está o cardápio. O que vão beber?"],
     ["v","Une carafe d'eau, s'il vous plaît.","Uma jarra de água, por favor."],
     ["a","Vous avez choisi ?","Já escolheram?"],
     ["v","Je voudrais le steak-frites.","Eu gostaria do bife com fritas."],
     ["a","Et avec ceci ?","E mais alguma coisa?"],
     ["v","Rien d'autre, merci. L'addition, s'il vous plaît.","Nada mais, obrigado. A conta, por favor."]],
    [["a","Vous avez réservé ?","Vocês reservaram?"],
     ["v","Oui, au nom de Silva, pour vingt heures.","Sim, no nome de Silva, para as vinte horas."],
     ["a","Quelle cuisson pour la viande ?","Qual o ponto da carne?"],
     ["v","À point, s'il vous plaît.","Ao ponto, por favor."],
     ["a","Vous prenez une entrée ?","Vão querer uma entrada?"],
     ["v","Oui, la soupe à l'oignon, et un verre de vin rouge.","Sim, a sopa de cebola e uma taça de vinho tinto."],
     ["a","Tout se passe bien ?","Está tudo bem?"],
     ["v","C'est délicieux, merci. On peut avoir l'addition ?","Está delicioso, obrigado. Pode trazer a conta?"]],
    [["a","Je vous présente le menu du jour ?","Posso apresentar o menu do dia?"],
     ["v","Oui, avec plaisir. Qu'est-ce que vous nous conseillez ?","Sim, com prazer. O que nos aconselha?"],
     ["a","Le confit de canard est notre spécialité, et le poisson est très frais aujourd'hui.","O confit de pato é nossa especialidade, e o peixe está bem fresco hoje."],
     ["v","Je suis allergique aux fruits à coque. Est-ce que la sauce en contient ?","Sou alérgico a castanhas. O molho contém?"],
     ["a","Je vérifie tout de suite en cuisine.","Vou verificar agora na cozinha."],
     ["v","Merci. Est-ce qu'on peut payer séparément ?","Obrigado. Podemos pagar separado?"],
     ["a","Bien sûr. Vous désirez un dessert ou un café ?","Claro. Desejam uma sobremesa ou um café?"],
     ["v","Deux cafés, merci. Le service est compris ?","Dois cafés, obrigado. O serviço está incluído?"]]
  ]}
},
de: {
  imm: { tip: "Muitos lugares na Alemanha ainda preferem dinheiro: tenha euros em espécie. Como é Schengen, leve seguro viagem e reserva do hotel.", l: [
    [["a","Guten Tag. Ihren Reisepass, bitte.","Bom dia. Seu passaporte, por favor."],
     ["v","Guten Tag. Bitte schön.","Bom dia. Aqui está."],
     ["a","Was ist der Zweck Ihrer Reise?","Qual é o objetivo da sua viagem?"],
     ["v","Tourismus. Ich mache Urlaub.","Turismo. Estou de férias."],
     ["a","Wie lange bleiben Sie?","Quanto tempo vai ficar?"],
     ["v","Zehn Tage.","Dez dias."],
     ["a","Wo übernachten Sie?","Onde vai se hospedar?"],
     ["v","In einem Hotel in Berlin.","Em um hotel em Berlim."]],
    [["a","Haben Sie ein Rückflugticket?","Tem passagem de volta?"],
     ["v","Ja, ich fliege am zwanzigsten zurück nach Brasilien.","Sim, volto para o Brasil no dia vinte."],
     ["a","Sind Sie zum ersten Mal in Deutschland?","É sua primeira vez na Alemanha?"],
     ["v","Nein, ich war vor zwei Jahren schon einmal hier.","Não, já estive aqui há dois anos."],
     ["a","Haben Sie etwas zu verzollen?","Tem algo a declarar?"],
     ["v","Nein, nur Kleidung und ein paar Geschenke.","Não, só roupas e alguns presentes."],
     ["a","Reisen Sie allein?","Viaja sozinho?"],
     ["v","Nein, ich reise mit einem Freund.","Não, viajo com um amigo."]],
    [["a","Was machen Sie beruflich in Brasilien?","O que você faz profissionalmente no Brasil?"],
     ["v","Ich arbeite in der Finanzbranche und habe zwei Wochen Urlaub genommen.","Trabalho no setor financeiro e tirei duas semanas de férias."],
     ["a","Haben Sie eine Reiseversicherung und eine Hotelbuchung?","Tem seguro viagem e reserva de hotel?"],
     ["v","Ja, hier sind die Buchung und die Versicherungsbestätigung.","Sim, aqui estão a reserva e o comprovante do seguro."],
     ["a","Wie viel Geld haben Sie für den Aufenthalt dabei?","Quanto dinheiro tem para a estadia?"],
     ["v","Ungefähr tausend Euro in bar und meine Kreditkarten.","Cerca de mil euros em espécie e meus cartões de crédito."],
     ["a","In Ordnung. Einen schönen Aufenthalt.","Certo. Boa estadia."],
     ["v","Vielen Dank, schönen Tag noch.","Muito obrigado, tenha um bom dia."]]
  ]},
  rest: { tip: "Na Alemanha, diga o total já com a gorjeta ao pagar (conta de 46 €, diga 'fünfzig'). 'Getrennt oder zusammen?' quer dizer: separado ou junto?", l: [
    [["a","Guten Abend! Wie viele Personen?","Boa noite! Quantas pessoas?"],
     ["v","Einen Tisch für zwei, bitte.","Uma mesa para dois, por favor."],
     ["a","Hier ist die Speisekarte. Was möchten Sie trinken?","Aqui está o cardápio. O que desejam beber?"],
     ["v","Ein stilles Wasser, bitte.","Uma água sem gás, por favor."],
     ["a","Haben Sie schon gewählt?","Já escolheram?"],
     ["v","Ich hätte gern das Schnitzel.","Eu gostaria do schnitzel."],
     ["a","Sonst noch etwas?","Mais alguma coisa?"],
     ["v","Nein, danke. Die Rechnung, bitte.","Não, obrigado. A conta, por favor."]],
    [["a","Haben Sie reserviert?","Vocês reservaram?"],
     ["v","Ja, auf den Namen Silva, für acht Uhr.","Sim, no nome de Silva, para as oito."],
     ["a","Wie möchten Sie das Steak?","Como deseja o bife?"],
     ["v","Medium, bitte.","Ao ponto, por favor."],
     ["a","Möchten Sie Pommes oder Kartoffelsalat dazu?","Deseja batata frita ou salada de batata para acompanhar?"],
     ["v","Kartoffelsalat, bitte. Und ein kleines Bier.","Salada de batata, por favor. E uma cerveja pequena."],
     ["a","Schmeckt es Ihnen?","Estão gostando?"],
     ["v","Ja, sehr lecker, danke. Wir möchten bitte zahlen.","Sim, muito gostoso, obrigado. Queremos pagar, por favor."]],
    [["a","Darf ich Ihnen unsere Tagesempfehlung vorstellen?","Posso apresentar a sugestão do dia?"],
     ["v","Ja, gern. Was können Sie uns empfehlen?","Sim, com prazer. O que pode nos recomendar?"],
     ["a","Heute haben wir Rinderroulade mit Rotkohl und frischen Spargel.","Hoje temos rolê de carne com repolho roxo e aspargos frescos."],
     ["v","Ich bin allergisch gegen Nüsse. Ist in der Soße etwas davon?","Sou alérgico a castanhas. Tem algo disso no molho?"],
     ["a","Ich frage sicherheitshalber in der Küche nach.","Vou perguntar na cozinha, por segurança."],
     ["v","Danke. Können wir bitte getrennt zahlen?","Obrigado. Podemos pagar separado, por favor?"],
     ["a","Natürlich. Möchten Sie noch einen Nachtisch oder Kaffee?","Claro. Desejam uma sobremesa ou café?"],
     ["v","Zwei Espresso, bitte. Kann ich mit Karte zahlen?","Dois expressos, por favor. Posso pagar com cartão?"]]
  ]}

ja: {

  air: { tip: "Nos EUA, a maioria das companhias cobra a bagagem despachada à parte em voos domésticos. Chegue 2 horas antes no doméstico e 3 no internacional.", l: [

     ["v","Yes, please. And will my checked bag be transferred automatically?","Sim, por favor. E minha mala despachada vai ser transferida automaticamente?"],

     ["v","Here you go.","Aqui estão."],
     ["a","You're in room 512. Here's your key.","Você está no quarto 512. Aqui está sua chave."],
     ["v","What's the Wi-Fi password?","Qual é a senha do Wi-Fi?"],
     ["a","It's on the card with your key.","Está no cartão junto com a chave."],
     ["v","Thank you. What time is breakfast?","Obrigado. Que horas é o café da manhã?"]],
    [["a","Front desk, how can I help you?","Recepção, como posso ajudar?"],
     ["v","Hi, this is room 512. The air conditioning isn't working.","Oi, aqui é do quarto 512. O ar-condicionado não está funcionando."],
     ["a","I'm sorry about that. I'll send someone up right away.","Sinto muito. Vou mandar alguém subir agora mesmo."],
     ["v","Thanks. Could I also get some extra towels?","Obrigado. Pode mandar também umas toalhas extras?"],
     ["a","Of course. Anything else?","Claro. Mais alguma coisa?"],
     ["v","Is it possible to get a late checkout tomorrow?","É possível fazer o checkout mais tarde amanhã?"],
     ["a","I can give you until one p.m. at no charge.","Posso deixar até as 13h sem custo."],
     ["v","Perfect. Can you also store my luggage after that?","Perfeito. Vocês podem guardar minha bagagem depois disso?"]],
    [["a","Good evening. How was your stay?","Boa noite. Como foi sua estadia?"],
     ["v","Mostly good, but I noticed a charge on my bill that I don't recognize.","No geral boa, mas notei uma cobrança na conta que não reconheço."],
     ["a","Let me take a look. That's the daily resort fee.","Deixe-me ver. É a taxa diária do resort."],
     ["v","That wasn't mentioned when I booked. Could you remove it?","Isso não foi informado quando reservei. Pode retirar?"],
     ["a","I'll check with my manager, but I can at least waive one night.","Vou ver com meu gerente, mas posso pelo menos isentar uma noite."],
     ["v","I appreciate that. Also, the room next door was really noisy last night.","Agradeço. Além disso, o quarto ao lado estava bem barulhento ontem à noite."],
     ["a","I'm so sorry. I'll make a note and take care of that fee entirely.","Sinto muito. Vou registrar e retirar essa taxa por completo."],

  shop: { tip: "Nos EUA o preço da etiqueta não inclui o imposto (sales tax), que é somado no caixa e muda de estado para estado. Guarde o recibo para trocas.", l: [

     ["a","Can I put your bag in the trunk?","Posso colocar sua mala no porta-malas?"],

  interview: { tip: "Em entrevistas nos EUA, responda com exemplos concretos e números. Use o método STAR: Situação, Tarefa, Ação e Resultado.", l: [

     ["a","What did you do differently after that?","O que você fez diferente depois disso?"],

function parseLoose(t){
  t=String(t||"").trim();
  try{return JSON.parse(t)}catch(e){}
  const m=t.match(/```(?:json)?\s*([\s\S]*?)```/);if(m){try{return JSON.parse(m[1])}catch(e){}}
  const a=t.indexOf("{"),b=t.lastIndexOf("}");
  if(a>=0&&b>a){try{return JSON.parse(t.slice(a,b+1))}catch(e){}}
  throw {msg:AI_ERR.invalid_json};
}
async function aiJSON(prompt,opts={}){
  if(AI.kind==="claude"){

  }

      r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(gemModel())}:generateContent`,{
        method:"POST",signal:opts.signal,
        headers:{"Content-Type":"application/json","x-goog-api-key":gemKey()},

    }catch(e){
      if(e&&e.name==="AbortError")throw {cancelled:true};
      throw {msg:"Sem conexão com o Gemini. Confira a internet."};

    if(!r.ok){
      const st=r.status;
      if(st===400||st===401||st===403)throw {msg:"O Gemini recusou a chave. Confira a chave em Ajustes."};
      if(st===404)throw {msg:"Esse modelo do Gemini não existe mais. Escolha outro em Ajustes."};
      if(st===429)throw {msg:"Limite gratuito do Gemini atingido. Espere um minuto, ou até amanhã se for o limite diário."};
      throw {msg:`O Gemini falhou (erro ${st}). Tente de novo.`};
    }
    const j=await r.json();
    const text=(j.candidates?.[0]?.content?.parts||[]).map(p=>p.text||"").join("");
    if(!text)throw {msg:"O Gemini não respondeu a essa mensagem. Tente dizer de outro jeito."};
    return parseLoose(text);
  }
  throw {msg:"A conversa com IA ainda não está configurada."};
}
/* Lista os modelos "flash" gratuitos disponíveis para a chave e escolhe o mais novo */
async function gemListModels(key){
  const r=await fetch("https://generativelanguage.googleapis.com/v1beta/models?pageSize=200",{headers:{"x-goog-api-key":key}});
  if(!r.ok)throw r.status;
  const j=await r.json();
  const names=(j.models||[]).filter(m=>(m.supportedGenerationMethods||[]).includes("generateContent"))
    .map(m=>String(m.name).replace(/^models\//,""))
    .filter(n=>/flash/.test(n)&&!/(image|tts|audio|live|embed|exp|8b|thinking|robotics|computer|vision)/.test(n));
  const ver=n=>{const m=n.match(/gemini-(\d+(?:\.\d+)?)/);return m?parseFloat(m[1]):0};
  return names.sort((a,b)=>(/preview/.test(a)-/preview/.test(b))||(ver(b)-ver(a))||(/lite/.test(a)-/lite/.test(b))||a.localeCompare(b));
}

- If the learner writes in Portuguese, put in "better" how to say it in ${lang}, explain briefly in "correction", and continue the scene.
- "reply_pt": Brazilian Portuguese translation of "reply".
- "romaji": ${S.lang==="ja"?"Hepburn romaji of \"reply\"":"empty string"}.
${ctx}

${turns||"(nothing yet: open the scene with your first line)"}

Reply with only this JSON object: {"reply":"...","reply_pt":"...","correction":"...","better":"...","romaji":"..."}`;

function talkSummaryPrompt(){
  const lang=LANG_EN[S.lang];
  const turns=LT.turns.map(x=>(x.who==="ai"?"PARTNER: ":"LEARNER: ")+x.text).join("\n");
  return `You are an encouraging but honest ${lang} teacher for a Brazilian learner (level: ${LEVELS[LT.lvl]}).
Below is a role-play (${talkById(LT.scen).name}). Evaluate ONLY the learner's messages.
Reply with only this JSON object:
{"score": integer from 0 to 10,

 "strengths": ["up to 3 short points in Brazilian Portuguese"],
 "fixes": [{"wrong":"what the learner said","right":"natural ${lang}","why":"short reason in Brazilian Portuguese"}] (up to 5, most important first; empty if none),

Transcript:
${turns.slice(-12000)}`;

async function talkCall(){
  LT.busy=true;LT.err=null;render();
  LT.ctl=new AbortController();
  try{
    const r=await aiJSON(talkPrompt(),{signal:LT.ctl.signal});
    if(!LT)return;
    const reply=String(r.reply||"").trim();
    if(!reply)throw {msg:AI_ERR.empty_completion};
    const last=[...LT.turns].reverse().find(x=>x.who==="me");
    if(last&&!last.checked){last.checked=true;last.correction=String(r.correction||"").trim();last.better=String(r.better||"").trim()}
    LT.turns.push({who:"ai",text:reply,pt:String(r.reply_pt||""),ro:String(r.romaji||"")});
    LT.busy=false;render();
    say(reply);
  }catch(e){
    if(!LT)return;
    LT.busy=false;
    if(!e||!e.cancelled)LT.err=(e&&e.msg)||AI_ERR.upstream_error;
    render();
  }
}
function talkStart(){
  const sc=document.querySelector('input[name="tscen"]:checked'), lv=document.querySelector('input[name="tlvl"]:checked');
  LT={scen:sc?sc.value:"hotel",lvl:lv?+lv.value:(LG().level??0),turns:[],draft:"",busy:false,step:V.step};
  render();talkCall();
}
function talkSend(text){
  text=String(text||"").trim();
  if(!text||LT.busy)return;
  LT.turns.push({who:"me",text});LT.draft="";LT.lastFinish=false;
  talkCall();
}
async function talkMic(){
  if(LT.listening){try{recActive&&recActive.stop()}catch(e){}return}
  LT.listening=true;LT.err=null;render();
  try{
    const alts=await listen(bcp(),true);
    LT.listening=false;
    talkSend(alts[0]);
  }catch(e){
    LT.listening=false;
    if(e==="not-allowed"||e==="service-not-allowed"){micBlocked=true;LT.err="O microfone não foi liberado. Escreva sua resposta."}
    else if(e==="no-speech")LT.err="Não ouvi nada. Toque no microfone e fale logo em seguida.";
    else if(e!=="aborted")LT.err="Não consegui ouvir. Tente de novo ou escreva.";
    render();
  }
}
async function talkFinish(){
  const mine=LT.turns.filter(x=>x.who==="me").length;
  if(mine<2){toast("Responda pelo menos duas vezes antes de pedir a avaliação.");return}
  stopAudio();
  LT.busy=true;LT.err=null;LT.summarizing=true;render();
  LT.ctl=new AbortController();
  try{
    const r=await aiJSON(talkSummaryPrompt(),{tier:"default",signal:LT.ctl.signal});
    if(!LT)return;
    LT.summary={
      score:Math.max(0,Math.min(10,Math.round(+r.score||0))),
      summary:String(r.summary||""),
      strengths:(r.strengths||[]).slice(0,3).map(String),
      fixes:(r.fixes||[]).slice(0,5).filter(f=>f&&f.right).map(f=>({wrong:String(f.wrong||""),right:String(f.right),why:String(f.why||"")})),
      phrases:(r.phrases||[]).slice(0,4).filter(p=>p&&p.text).map(p=>({text:String(p.text),pt:String(p.pt||"")}))
    };
    LT.busy=false;LT.summarizing=false;
    if(LT.step!=null)markStep(LT.step);
    render();window.scrollTo(0,0);
  }catch(e){
    if(!LT)return;
    LT.busy=false;LT.summarizing=false;
    if(!e||!e.cancelled)LT.err=(e&&e.msg)||AI_ERR.upstream_error;
    render();
  }
}
/* Frases da conversa entram na revisão espaçada */
function addCustom(text,pt){
  const lg=LG();lg.custom=lg.custom||{};
  const id=Object.keys(lg.custom).find(k=>lg.custom[k].text===text)||("x"+Date.now().toString(36)+Math.random().toString(36).slice(2,6));
  lg.custom[id]={text,pt};
  if(!lg.srs["u|"+id])lg.srs["u|"+id]={b:0,d:dstr(addDays(1))};
}
function talkSaveReview(){
  const s=LT.summary;if(!s)return;
  s.fixes.forEach(f=>addCustom(f.right,f.why||f.wrong));
  s.phrases.forEach(p=>addCustom(p.text,p.pt));
  s.saved=true;save();
  toast("Frases adicionadas à revisão de amanhã.");render();
}
async function fixAnswer(qid){
  const q=questions().find(x=>x.id===qid), a=(S.answers[qid]||"").trim();
  if(!a)return;
  ansFix[qid]={busy:true};render();
  try{
    const r=await aiJSON(`You are a US hiring coach helping a Brazilian professional prepare for a job interview in English.
Interview question: "${q.q}"
Candidate's draft answer (may contain mistakes or Portuguese):
"""${a.slice(0,3000)}"""
Rewrite it in natural, professional American English that is easy to say out loud: at most 90 words, short sentences, first person. Keep the candidate's facts; do not invent companies or numbers. If an important detail is missing, keep or add a placeholder in [brackets].
Reply with only this JSON object: {"improved":"...","notes":["up to 3 short notes in Brazilian Portuguese about what you changed and why"]}`,{tier:"default"});
    ansFix[qid]={improved:String(r.improved||"").trim(),notes:(r.notes||[]).slice(0,3).map(String)};
    if(!ansFix[qid].improved)throw {msg:AI_ERR.empty_completion};
  }catch(e){ansFix[qid]={err:(e&&e.msg)||AI_ERR.upstream_error}}
  if(V.name==="answers")render();
}

function speak(text,slow,onend){
  if(!("speechSynthesis" in window)){toast("Este navegador não tem leitura em voz alta.");return}
  unlockAudio();
  try{
    const ss=window.speechSynthesis;
    /* No iPhone, cancelar logo antes de falar faz a fala sumir: só cancela se algo estiver tocando */
    if(ss.speaking||ss.pending)ss.cancel();
    if(ss.paused)ss.resume();
    const u=new SpeechSynthesisUtterance(text);

    u.onerror=e=>{if(e&&e.error!=="interrupted"&&e.error!=="canceled")soundHelp();if(onend)onend()};
    ss.speak(u);
    setTimeout(()=>{if(!started&&!ss.speaking)soundHelp()},2500);
  }catch(e){toast("Não consegui tocar o áudio.")}
}

/* Shadowing: toca a frase 3 vezes no ritmo escolhido, com pausa para você falar junto */
function shadow(text){
  const my=++loopToken; let n=0;
  const gap=Math.max(1200,text.length*55);
  const next=()=>{
    if(my!==loopToken)return;
    if(n>=3){toast("Shadowing concluído. Agora grave sozinho.");return}
    n++; toast(`Fale junto: ${n} de 3`);
    speak(text,false,()=>{if(my===loopToken)setTimeout(next,gap)});
  };
  next();
}
const Rec=window.SpeechRecognition||window.webkitSpeechRecognition;
let micBlocked=false, recActive=null;
const canListen=()=>!!Rec&&!micBlocked;
function listen(bcp,continuous){
  return new Promise((res,rej)=>{
    let r;
    try{r=new Rec()}catch(e){rej("unsupported");return}
    recActive=r;
    r.lang=bcp; r.interimResults=false; r.maxAlternatives=continuous?1:4; r.continuous=!!continuous;
    let done=false; const parts=[];
    r.onresult=e=>{
      if(continuous){for(let i=e.resultIndex;i<e.results.length;i++)if(e.results[i].isFinal)parts.push(e.results[i][0].transcript);return}
      done=true;const alts=[];const r0=e.results[0];for(let i=0;i<r0.length;i++)alts.push(r0[i].transcript);res(alts);
    };
    r.onerror=e=>{if(continuous&&parts.length&&e.error==="no-speech")return;done=true;rej(e.error||"error")};
    r.onend=()=>{recActive=null;if(done)return;if(parts.length)res([parts.join(" ")]);else rej("no-speech")};
    try{loopToken++;if("speechSynthesis" in window)speechSynthesis.cancel();r.start()}catch(e){rej("start")}
  });
}

/* ============ PONTUAÇÃO DA FALA ============ */
function normText(s,lang){
  s=String(s).toLowerCase().normalize("NFKC");
  if(lang!=="ja")s=s.normalize("NFD").replace(/[̀-ͯ]/g,"");
  s=s.replace(/[’'`]/g,"").replace(/[^\p{L}\p{N}\s]/gu," ");
  return s.replace(/\s+/g," ").trim();
}
function lcs(a,b){
  const n=a.length,m=b.length,dp=[];
  for(let i=0;i<=n;i++)dp.push(new Uint16Array(m+1));
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)dp[i][j]=a[i]===b[j]?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);
  const ok=new Array(n).fill(false);let i=0,j=0;
  while(i<n&&j<m){if(a[i]===b[j]){ok[i]=true;i++;j++}else if(dp[i+1][j]>=dp[i][j+1])i++;else j++}
  return ok;
}
function scoreOne(target,hyp,lang){
  if(lang==="ja"){
    const chars=[...target], idx=[], toks=[];
    chars.forEach((c,i)=>{if(!/[\p{P}\s]/u.test(c)){idx.push(i);toks.push(c.normalize("NFKC"))}});
    const h=[...normText(hyp,"ja").replace(/\s/g,"")];
    const ok=lcs(toks,h);
    const parts=chars.map(c=>({text:c,ok:null}));
    idx.forEach((ci,k)=>parts[ci].ok=ok[k]);
    const hit=ok.filter(Boolean).length;
    return {pct:toks.length?Math.round(hit/toks.length*100):0,parts,join:""};
  }
  const disp=target.split(/\s+/), idx=[], toks=[];
  disp.forEach((w,i)=>{const n=normText(w,lang).replace(/ /g,"");if(n){idx.push(i);toks.push(n)}});
  const h=normText(hyp,lang).split(" ").filter(Boolean);
  const ok=lcs(toks,h);
  const parts=disp.map(w=>({text:w,ok:null}));
  idx.forEach((di,k)=>parts[di].ok=ok[k]);
  const hit=ok.filter(Boolean).length;
  return {pct:toks.length?Math.round(hit/toks.length*100):0,parts,join:" "};
}
function scoreBest(target,alts,lang){
  let best=null;
  for(const a of alts){const r=scoreOne(target,a,lang);r.heard=a;if(!best||r.pct>best.pct)best=r}
  return best||{pct:0,parts:[],heard:""};
}

function remainingActs(){
  const start=LG().level??0, out=[];
  for(let lvl=start;lvl<3;lvl++)for(const sc of focusScens()){
    const u=unit(sc.id,lvl);
    for(const a of ACTS)if(!actDone(u,a.id))out.push({scen:sc.id,lvl,act:a.id});
  }
  return out;
}
function chunkOrder(){
  const srs=LG().srs;
  return chunks().map((c,i)=>{const b=Math.max(srs[`c|${i}|0`]?.b??-1,srs[`c|${i}|1`]?.b??-1);return {i,b}})
    .sort((a,b)=>a.b-b.b||a.i-b.i).map(x=>x.i);
}
function buildSession(){
  const lg=LG(), m=lg.plan.minutes, cfg=SESSION_CFG[m], steps=[];
  if(lg.level===null)steps.push({k:"test"});
  const due=dueKeys().length;
  if(due)steps.push({k:"review",n:Math.min(due,cfg.rev)});
  if(cfg.ch&&chunks().length)steps.push({k:"chunks",n:cfg.ch});
  remainingActs().slice(0,cfg.acts).forEach(a=>steps.push(Object.assign({k:"act"},a)));
  if(cfg.talk&&(gemKey()||inClaude()))steps.push({k:"talk"});
  if(cfg.listen)steps.push({k:"listen",min:cfg.listen});
  return {date:today(),minutes:m,steps};
}
const stepDone = s => s.done || (s.k==="act"&&actDone(unit(s.scen,s.lvl),s.act)) || (s.k==="test"&&LG().level!==null);
function getSession(){
  const lg=LG(); let s=lg.session;
  const fresh=!s||s.date!==today()||(s.minutes!==lg.plan.minutes&&!s.steps.some(x=>x.done));
  if(fresh){lg.session=buildSession();save()}
  return lg.session;

function stepInfo(s){
  if(s.k==="test")return {t:"Teste de nível",d:"12 perguntas, cerca de 8 min",min:8};
  if(s.k==="review")return {t:"Revisão",d:`${s.n} ${s.n===1?"frase":"frases"} que estão no dia de revisar`,min:Math.ceil(s.n/2)};
  if(s.k==="talk")return {t:"Conversa livre com IA",d:"Role-play com correção, cerca de 5 min",min:5};
  if(s.k==="chunks")return {t:"Blocos de frases",d:`${s.n} ${s.n===1?"bloco":"blocos"} com shadowing`,min:s.n*2};
  if(s.k==="act")return {t:actName(s.act),d:`${scName(s.scen)} · ${LEVELS[s.lvl]}`,min:5};
  return {t:"Escuta real",d:`${s.min} min de áudio nativo, sem pausar`,min:s.min};
}
function startStep(i){

  else if(s.k==="review")startReview(s.n,i);
  else if(s.k==="chunks")startChunks(s.n,i);
  else if(s.k==="act")startLesson(s.scen,s.lvl,s.act,i);

function nextStepIndex(){const s=getSession();return s.steps.findIndex(x=>!stepDone(x))}
function planInfo(){
  const p=LG().plan, rem=remainingActs(), perDay=SESSION_CFG[p.minutes].acts;
  const left=daysUntil(p.date);
  const info={perDay,rem:rem.length,left,days:Math.ceil(rem.length/perDay)};
  if(left!==null&&left>0){
    info.capacity=left*perDay;
    info.fits=info.capacity>=rem.length;
    const need=Math.ceil(rem.length/left);
    info.needMin=need<=1?15:need<=2?30:60;
  }
  info.schedule=[];
  const days=Math.min(7,left!==null&&left>0?left:7);
  for(let i=0,k=0;i<days&&k<rem.length;i++){info.schedule.push({date:addDays(i),items:rem.slice(k,k+perDay)});k+=perDay}
  return info;
}

/* ----- Montagem de lições ----- */
function launch(ls){LS=ls;go("lesson");autoPlay()}
function autoPlay(){
  const it=LS&&LS.items[LS.i];if(!it)return;
  if(it.type==="conv")say(it.them[1]);
  else if(it.type==="listen")say(it.line[1]);
  else if(it.type==="ans")say(it.q.q);
}
function startLesson(scen,lvl,mode,step){
  const ls=lines(scen,lvl), base={mode,scen,lvl,i:0,scores:[],step};
  let items;
  if(mode==="rep")items=ls.map((l,i)=>({type:"rep",line:l,key:`s|${scen}|${lvl}|${i}`}));
  else if(mode==="conv"){items=[];for(let i=0;i<ls.length;i+=2)items.push({type:"conv",them:ls[i],you:ls[i+1],idx:i,key:`s|${scen}|${lvl}|${i+1}`})}
  else{
    const pool=ls.concat(otherLines(scen,lvl));
    items=pick(ls.map((l,i)=>({l,i})),6).map((o,k)=>{const it=makeChoice(o.l,pool,k%2===0?"listen":"meaning");it.key=`s|${scen}|${lvl}|${o.i}`;return it});
  }
  launch(Object.assign(base,{items}));
}
function otherLines(scen,lvl){
  const sc=scenById(scen), out=[];
  for(const s of scensFor())if(s.track===sc.track)for(let l=0;l<3;l++)if(!(s.id===scen&&l===lvl)&&Math.abs(l-lvl)<=1)out.push(...lines(s.id,l));
  return out;
}
function makeChoice(line,pool,kind){
  const field=kind==="listen"?2:1;
  const seen=new Set([line[field]]);const distract=[];
  for(const o of shuffle(pool)){if(!seen.has(o[field])){seen.add(o[field]);distract.push(o)}if(distract.length===3)break}
  return {type:kind,line,opts:shuffle([line,...distract]).map(o=>o[field]),answer:line[field]};
}
function startTest(step){
  const items=[];
  const travel=scensFor().filter(s=>s.track==="travel");
  for(let lvl=0;lvl<3;lvl++){
    const pool=[];travel.forEach(sc=>pool.push(...lines(sc.id,lvl)));
    const chosen=pick(pool,4);
    chosen.slice(0,3).forEach((l,i)=>{const it=makeChoice(l,pool,i===1?"meaning":"listen");it.lvl=lvl;items.push(it)});
    const sp=chosen[3];
    const it=canListen()?{type:"speak",line:sp}:makeChoice(sp,pool,"listen");
    it.lvl=lvl;items.push(it);
  }
  launch({mode:"test",i:0,items,results:[],step});
}
function startReview(n,step){
  const keys=dueKeys().slice(0,n||15);
  if(!keys.length){toast(srsCount()?"Nada para revisar hoje. Volte amanhã.":"Pratique algumas frases primeiro. Elas entram na revisão automaticamente.");return}
  launch({mode:"review",i:0,scores:[],step,items:keys.map(k=>Object.assign({type:"rev",key:k},keyItem(k)))});
}
function startChunks(n,step){
  const items=[];
  chunkOrder().slice(0,n||3).forEach(ci=>{const ch=chunks()[ci];
    ch[2].forEach((ex,ei)=>items.push({type:"rep",line:["v",ex[0],ex[1],ex[2]],key:`c|${ci}|${ei}`,chunk:ch}))});
  launch({mode:"chunks",i:0,scores:[],step,items});
}

function finishLesson(){
  const step=LS.step;
  if(LS.mode==="test"){
    const per=[0,1,2].map(l=>{const r=LS.results.filter(x=>x.lvl===l);return Math.round(r.filter(x=>x.ok).length/Math.max(1,r.length)*100)});
    let level=0;
    if(per[0]>=75){level=1;if(per[1]>=75)level=2}
    LG().level=level;LG().test={date:today(),per};
    LG().session=null; save();
    go("result",{kind:"test",per,level});
    return;
  }
  let score;
  if(LS.mode==="quiz")score=Math.round(LS.scores.filter(Boolean).length/LS.items.length*100);
  else{const vals=LS.scores.filter(x=>typeof x==="number");score=vals.length?Math.round(vals.reduce((a,b)=>a+b,0)/vals.length):0}
  if(LS.scen&&score>0)setUnit(LS.scen,LS.lvl,LS.mode,score);
  if(step!=null&&(score>0||LS.mode==="quiz"))markStep(step);
  go("result",{kind:LS.mode,score,scen:LS.scen,lvl:LS.lvl,fromSession:step!=null,n:LS.items.length});
}

}

  if(isQuiz)msg=passed?"Nível concluído neste cenário.":"Faltou pouco. Revise as frases e tente de novo; são precisos 80%.";
  else if(V.score<=0)msg="Nenhuma frase foi praticada, então a atividade não foi registrada.";

function currentTarget(it){return it.type==="conv"?it.you[1]:it.type==="ans"?it.text:it.type==="rev"?it.text:it.line[1]}
async function doMic(){
  if(LS.listening){try{recActive&&recActive.stop()}catch(e){}return}
  const it=LS.items[LS.i], target=currentTarget(it);
  LS.listening=true;LS.res=null;render();
  try{
    const alts=await listen(bcp(),it.type==="ans");
    LS.listening=false;
    const r=scoreBest(target,alts,S.lang);
    LS.res=r;
    if(it.type==="speak")LS.cur={ok:r.pct>=PASS_SPEAK};
    else LS.cur=Math.max(typeof LS.cur==="number"?LS.cur:0,r.pct);
    if(it.type==="rev"&&LS.revOk===undefined)LS.revOk=r.pct>=PASS_SPEAK;
  }catch(e){
    LS.listening=false;
    if(e==="not-allowed"||e==="service-not-allowed"){micBlocked=true;LS.res={error:"O microfone não foi liberado. Permita o acesso ao microfone nas configurações do navegador, ou use “Falei em voz alta”."}}
    else if(e==="no-speech")LS.res={error:"Não ouvi nada. Toque no microfone e fale logo em seguida."};
    else if(e==="aborted")LS.res=null;
    else if(e==="network")LS.res={error:"O reconhecimento de fala precisa de internet neste navegador."};
    else LS.res={error:"Não consegui ouvir. Tente de novo."};
  }
  render();
}
function doNext(){
  const it=LS.items[LS.i];
  if(LS.mode==="test"){
    if(it.type==="speak")LS.results.push({lvl:it.lvl,ok:!!(LS.cur&&LS.cur.ok)});
    else LS.results.push({lvl:it.lvl,ok:!!(LS.answered&&LS.answered.ok)});
  }else if(LS.mode==="quiz"){
    const ok=!!(LS.answered&&LS.answered.ok);LS.scores.push(ok);srsMark(it.key,ok);
  }else if(it.type==="rev"){
    if(LS.revOk!==undefined){srsMark(it.key,LS.revOk);LS.scores.push(LS.revOk?100:0)}
  }else if(typeof LS.cur==="number"){
    LS.scores.push(LS.cur);
    if(it.key)srsMark(it.key,LS.cur>=PASS_SPEAK);
  }
  LS.cur=undefined;LS.res=null;LS.answered=null;LS.reveal=false;LS.revOk=undefined;
  stopAudio();LS.listening=false;
  if(LS.i>=LS.items.length-1){finishLesson();return}
  LS.i++;
  render();window.scrollTo(0,0);
  autoPlay();
}
let ansTimer=null;
const ACT={
  go:d=>go(d.to),
  lang:d=>{S.lang=d.lang;save();render()},
  unit:d=>go("unit",{scen:d.scen,lvl:+d.lvl}),
  start:d=>startLesson(d.scen,+d.lvl,d.mode),
  step:d=>startStep(+d.i),
  test:()=>startTest(),
  review:()=>startReview(15),
  chunksx:()=>startChunks(3),
  quit:()=>{LS=null;go("home")},
  say:d=>say(d.text,d.slow==="1"),
  shadow:d=>shadow(d.text),
  speed:d=>{S.speed=d.speed;save();render();
    const it=LS&&V.name==="lesson"?LS.items[LS.i]:null;
    say(it?(it.type==="conv"?it.them[1]:it.type==="ans"?it.q.q:currentTarget(it)):lines("imm",0)[0][1])},
  mic:()=>doMic(),
  selfok:()=>{LS.res={self:true};LS.cur=100;if(LS.items[LS.i].type==="rev"&&LS.revOk===undefined)LS.revOk=true;render()},
  revself:d=>{LS.revOk=d.ok==="1";render()},
  reveal:()=>{LS.reveal=true;render()},
  next:()=>doNext(),
  choose:d=>{const it=LS.items[LS.i],i=+d.i;LS.answered={i,ok:it.opts[i]===it.answer};render()},
  cleardate:()=>{LG().plan.date="";save();render()},
  usemodel:d=>{const q=questions().find(x=>x.id===d.q);S.answers[d.q]=q.model;save();render();const t=document.getElementById("ans-"+d.q);if(t){t.focus();t.setSelectionRange(0,0)}},
  sayans:d=>say(S.answers[d.q]||""),
  trainans:()=>startAnswers(),
  talkopen:()=>{LT=null;go("talk")},
  talkstart:()=>talkStart(),
  talksend:()=>{const t=document.getElementById("talk-input");talkSend(t?t.value:"")},
  talkmic:()=>talkMic(),
  talkretry:()=>{if(LT.summarizing||LT.turns.filter(x=>x.who==="me").length>=2&&LT.lastFinish)talkFinish();else talkCall()},
  talkfinish:()=>{LT.lastFinish=true;talkFinish()},
  talksave:()=>talkSaveReview(),
  talknew:()=>{const st=LT&&LT.step;LT=null;go("talk",{step:st})},
  talkquit:()=>{if(LT&&LT.ctl)LT.ctl.abort();const mine=LT?LT.turns.filter(x=>x.who==="me").length:0;if(LT&&LT.step!=null&&mine>=4)markStep(LT.step);LT=null;go("home")},
  fixans:d=>fixAnswer(d.q),
  usefix:d=>{S.answers[d.q]=ansFix[d.q].improved;delete ansFix[d.q];save();render();toast("Resposta atualizada.")},
  dropfix:d=>{delete ansFix[d.q];render()},
  gemsave:async()=>{
    const k=(document.getElementById("gem-key").value||"").trim();
    if(!k){toast("Cole a chave antes de salvar.");return}
    toast("Testando a chave…");
    try{
      const models=await gemListModels(k);
      store.set("embarque:gemini",k);AI.gemModels=models;
      if(models.length&&!models.includes(gemModel()))store.set("embarque:geminiModel",models[0]);
      refreshAI();toast("Chave salva. A conversa com IA está pronta.");
    }catch(e){toast(e===400||e===401||e===403?"O Google recusou essa chave. Confira se copiou inteira.":"Não consegui testar a chave agora. Confira a internet.")}
    render();
  },
  gemclear:()=>{try{localStorage.removeItem("embarque:gemini")}catch(e){}AI.gemModels=null;refreshAI();render()},
  listendone:()=>{markStep(V.step);toast("Escuta registrada.");go("home")},
  askreset:()=>{confirmReset=true;render()},
  cancelreset:()=>{confirmReset=false;render()},
  doreset:()=>{S.langs[S.lang]=blankLang();save();confirmReset=false;toast("Progresso apagado.");render()},
  logout:async()=>{try{await firebase.auth().signOut()}catch(e){}fb.localMode=false;go("auth")},
  toauth:()=>{fb.localMode=false;go("auth")},
  localmode:()=>{fb.localMode=true;uidKey="local";S=loadState();go("home")},
  authmode:d=>go("auth",{mode:d.mode})
};
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-act]");if(!t)return;
  const f=ACT[t.dataset.act];if(f){e.preventDefault();f(t.dataset,t)}
});
document.addEventListener("change",e=>{
  const t=e.target.closest("[data-change]");if(!t)return;
  const k=t.dataset.change, lg=LG();
  if(k==="plandate"){lg.plan.date=t.value;save();render()}
  else if(k==="planmin"){lg.plan.minutes=+t.value;save();render()}
  else if(k==="gemmodel"){store.set("embarque:geminiModel",t.value);toast("Modelo trocado.")}
  else if(k==="planfocus"){lg.plan.focus=t.value;if(lg.session&&!lg.session.steps.some(x=>x.done))lg.session=null;save();render()}
});
/* Respostas: salva enquanto digita, sem redesenhar a tela */
document.addEventListener("input",e=>{
  if(e.target.id==="talk-input"&&LT){LT.draft=e.target.value;return}
  const t=e.target.closest("[data-ans]");if(!t)return;
  S.answers[t.dataset.ans]=t.value;
  clearTimeout(ansTimer);ansTimer=setTimeout(save,600);
});
document.addEventListener("focusout",e=>{
  if(!(e.target.closest&&e.target.closest("[data-ans]")))return;
  save();
  setTimeout(()=>{const a=document.activeElement;if(V.name==="answers"&&!(a&&a.dataset&&a.dataset.ans))render()},300);
});
document.addEventListener("keydown",e=>{
  if(e.target.id==="talk-input"&&e.key==="Enter"&&!e.shiftKey){e.preventDefault();talkSend(e.target.value)}
});
document.addEventListener("submit",e=>{if(e.target.id==="authform"){e.preventDefault();submitAuth()}});

/* Tempo de estudo: conta enquanto uma lição está aberta e visível */
let tick=0;
setInterval(()=>{
  if((V.name==="lesson"||V.name==="listen"||V.name==="answers"||V.name==="talk")&&document.visibilityState==="visible"){
    S.days[today()]=(S.days[today()]||0)+5;
    if(++tick%6===0)save();
  }
},5000);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden")save()});

/* App instalável (funciona quando hospedado no GitHub Pages) */
if("serviceWorker" in navigator&&location.protocol==="https:"&&window.top===window.self){
  try{navigator.serviceWorker.register("sw.js").catch(()=>{})}catch(e){}
}

render();
initFirebase();
initAI();
</script>
</body>
</html>
